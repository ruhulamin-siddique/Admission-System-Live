{% load i18n %}
<div class="text-center py-3">
  <div class="d-inline-block p-3 rounded-circle bg-success text-white mb-2" style="font-size: 2.5rem;">
    <i class="fas fa-check-circle"></i>
  </div>
  <h4 class="font-weight-bold text-success">{% trans "OTP Verified Successfully!" %}</h4>
  <p class="text-muted mb-3">
    {% trans "Student" %}: <strong>{{ app.student_name }}</strong> (<code>{{ app.application_number }}</code>)
  </p>
  <div class="alert alert-info text-left small mb-3">
    <i class="fas fa-info-circle mr-1"></i>
    {% trans "Identity confirmed. Please record any verification notes and confirm document handover." %}
  </div>
  <form method="post" action="{% url 'coe_mark_delivered' app.pk %}">
    {% csrf_token %}
    <div class="form-group text-left">
      <label class="font-weight-bold">{% trans "Identity Verification Note (optional)" %}</label>
      <input type="text" name="identity_note" class="form-control" placeholder="{% trans 'e.g. NID checked ✓' %}">
    </div>
    <button type="submit" class="btn btn-success btn-block btn-lg">
      <i class="fas fa-hand-holding mr-2"></i>{% trans "Mark as Delivered" %}
    </button>
  </form>
</div>
