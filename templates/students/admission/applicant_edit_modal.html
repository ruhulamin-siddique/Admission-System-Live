{% load static %}
<div class="modal fade" id="applicantEditModal" tabindex="-1" role="dialog" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-centered modal-dialog-scrollable">
        <div class="modal-content">
            <div class="modal-header bg-warning py-2 text-dark">
                <h5 class="modal-title font-weight-bold">
                    <i class="fas fa-edit mr-2"></i> Edit Applicant: {{ applicant.name }} ({{ applicant.application_no }})
                </h5>
                <button type="button" class="close" data-dismiss="modal">&times;</button>
            </div>
            <form method="POST" action="{% url 'admin_edit_applicant' applicant.id %}" enctype="multipart/form-data" id="editApplicantForm">
                {% csrf_token %}
                <div class="modal-body p-4">
                    
                    <h6 class="font-weight-bold text-primary mb-2 border-bottom pb-1">Personal & Contact Info</h6>
                    <div class="row">
                        <div class="col-md-6 form-group">
                            <label class="small font-weight-bold">Full Name:</label>
                            <input type="text" class="form-control form-control-sm" name="name" value="{{ applicant.name }}" required>
                        </div>
                        <div class="col-md-6 form-group">
                            <label class="small font-weight-bold">Mobile Number:</label>
                            <input type="tel" class="form-control form-control-sm" name="mobile" value="{{ applicant.mobile }}" required>
                        </div>
                        <div class="col-md-6 form-group">
                            <label class="small font-weight-bold">Email:</label>
                            <input type="email" class="form-control form-control-sm" name="email" value="{{ applicant.email|default:'' }}">
                        </div>
                        <div class="col-md-6 form-group">
                            <label class="small font-weight-bold">National ID:</label>
                            <input type="text" class="form-control form-control-sm" name="national_id" value="{{ applicant.national_id|default:'' }}">
                        </div>
                        <div class="col-md-4 form-group">
                            <label class="small font-weight-bold">Gender:</label>
                            <select class="custom-select custom-select-sm" name="gender">
                                <option value="Male" {% if applicant.gender == 'Male' %}selected{% endif %}>Male</option>
                                <option value="Female" {% if applicant.gender == 'Female' %}selected{% endif %}>Female</option>
                            </select>
                        </div>
                        <div class="col-md-4 form-group">
                            <label class="small font-weight-bold">Blood Group:</label>
                            <input type="text" class="form-control form-control-sm" name="blood_group" value="{{ applicant.blood_group|default:'' }}">
                        </div>
                        <div class="col-md-4 form-group">
                            <label class="small font-weight-bold">Desired Program:</label>
                            <select class="custom-select custom-select-sm" name="desired_program">
                                {% for prog in all_programs %}
                                <option value="{{ prog.short_name|default:prog.name }}" {% if applicant.desired_program == prog.short_name or applicant.desired_program == prog.name %}selected{% endif %}>
                                    {{ prog.short_name|default:prog.name }}
                                </option>
                                {% endfor %}
                            </select>
                        </div>
                    </div>

                    <h6 class="font-weight-bold text-primary mb-2 border-bottom pb-1 mt-3">Family Information</h6>
                    <div class="row">
                        <div class="col-md-4 form-group">
                            <label class="small font-weight-bold">Father's Name:</label>
                            <input type="text" class="form-control form-control-sm" name="father_name" value="{{ applicant.father_name }}" required>
                        </div>
                        <div class="col-md-4 form-group">
                            <label class="small font-weight-bold">Father's Occupation:</label>
                            <input type="text" class="form-control form-control-sm" name="father_occupation" value="{{ applicant.father_occupation|default:'' }}">
                        </div>
                        <div class="col-md-4 form-group">
                            <label class="small font-weight-bold">Father's Mobile:</label>
                            <input type="tel" class="form-control form-control-sm" name="father_mobile" value="{{ applicant.father_mobile|default:'' }}">
                        </div>
                        <div class="col-md-4 form-group">
                            <label class="small font-weight-bold">Mother's Name:</label>
                            <input type="text" class="form-control form-control-sm" name="mother_name" value="{{ applicant.mother_name }}" required>
                        </div>
                        <div class="col-md-4 form-group">
                            <label class="small font-weight-bold">Mother's Occupation:</label>
                            <input type="text" class="form-control form-control-sm" name="mother_occupation" value="{{ applicant.mother_occupation|default:'' }}">
                        </div>
                        <div class="col-md-4 form-group">
                            <label class="small font-weight-bold">Mother's Mobile:</label>
                            <input type="tel" class="form-control form-control-sm" name="mother_mobile" value="{{ applicant.mother_mobile|default:'' }}">
                        </div>
                    </div>

                    <h6 class="font-weight-bold text-primary mb-2 border-bottom pb-1 mt-3">Academic Details (SSC & HSC)</h6>
                    <div class="row">
                        <div class="col-md-3 form-group">
                            <label class="small font-weight-bold">SSC School:</label>
                            <input type="text" class="form-control form-control-sm" name="ssc_school" value="{{ applicant.ssc_school|default:'' }}">
                        </div>
                        <div class="col-md-2 form-group">
                            <label class="small font-weight-bold">SSC Board:</label>
                            <input type="text" class="form-control form-control-sm" name="ssc_board" value="{{ applicant.ssc_board|default:'' }}">
                        </div>
                        <div class="col-md-2 form-group">
                            <label class="small font-weight-bold">SSC Roll:</label>
                            <input type="text" class="form-control form-control-sm" name="ssc_roll" value="{{ applicant.ssc_roll|default:'' }}">
                        </div>
                        <div class="col-md-2 form-group">
                            <label class="small font-weight-bold">SSC Reg:</label>
                            <input type="text" class="form-control form-control-sm" name="ssc_reg" value="{{ applicant.ssc_reg|default:'' }}">
                        </div>
                        <div class="col-md-1 form-group">
                            <label class="small font-weight-bold">Year:</label>
                            <input type="text" class="form-control form-control-sm" name="ssc_year" value="{{ applicant.ssc_year|default:'' }}">
                        </div>
                        <div class="col-md-2 form-group">
                            <label class="small font-weight-bold">SSC GPA:</label>
                            <input type="number" step="0.01" class="form-control form-control-sm" name="ssc_gpa" value="{{ applicant.ssc_gpa }}">
                        </div>

                        <div class="col-md-3 form-group">
                            <label class="small font-weight-bold">HSC College:</label>
                            <input type="text" class="form-control form-control-sm" name="hsc_college" value="{{ applicant.hsc_college|default:'' }}">
                        </div>
                        <div class="col-md-2 form-group">
                            <label class="small font-weight-bold">HSC Board:</label>
                            <input type="text" class="form-control form-control-sm" name="hsc_board" value="{{ applicant.hsc_board|default:'' }}">
                        </div>
                        <div class="col-md-2 form-group">
                            <label class="small font-weight-bold">HSC Roll:</label>
                            <input type="text" class="form-control form-control-sm" name="hsc_roll" value="{{ applicant.hsc_roll|default:'' }}">
                        </div>
                        <div class="col-md-2 form-group">
                            <label class="small font-weight-bold">HSC Reg:</label>
                            <input type="text" class="form-control form-control-sm" name="hsc_reg" value="{{ applicant.hsc_reg|default:'' }}">
                        </div>
                        <div class="col-md-1 form-group">
                            <label class="small font-weight-bold">Year:</label>
                            <input type="text" class="form-control form-control-sm" name="hsc_year" value="{{ applicant.hsc_year|default:'' }}">
                        </div>
                        <div class="col-md-2 form-group">
                            <label class="small font-weight-bold">HSC GPA:</label>
                            <input type="number" step="0.01" class="form-control form-control-sm" name="hsc_gpa" value="{{ applicant.hsc_gpa }}">
                        </div>
                    </div>

                    <h6 class="font-weight-bold text-primary mb-2 border-bottom pb-1 mt-3">Payment & Photo Update</h6>
                    <div class="row">
                        <div class="col-md-6 form-group">
                            <label class="small font-weight-bold">bKash TrxID:</label>
                            <input type="text" class="form-control form-control-sm font-weight-bold text-uppercase" name="payment_trx_id" value="{{ applicant.payment_trx_id }}">
                        </div>
                        <div class="col-md-6 form-group">
                            <label class="small font-weight-bold">Replace Photo (Optional):</label>
                            <input type="file" class="form-control-file" name="photo" accept="image/jpeg,image/png">
                        </div>
                    </div>

                </div>
                <div class="modal-footer py-2">
                    <button type="button" class="btn btn-secondary btn-sm" data-dismiss="modal">Cancel</button>
                    <button type="submit" class="btn btn-warning btn-sm font-weight-bold text-dark">
                        <i class="fas fa-save mr-1"></i> Save Changes
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
